<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -60 1600 540" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Rôles des nœuds Meshtastic</title>
  <desc id="d">Du mobile au sommet : client muet, client de base, routeur sur point haut, client, routeur tardif, client.</desc>
  <defs>
    <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1420"/><stop offset="1" stop-color="#16222f"/></linearGradient>
    <linearGradient id="roc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a97a6"/><stop offset="1" stop-color="#3d4854"/></linearGradient>
    <linearGradient id="roc2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6f7c8b"/><stop offset="1" stop-color="#36404b"/></linearGradient>
    <!-- Nœud LoRa générique : boîtier, petit écran, antenne -->
    <g id="noeud">
      <rect x="-3" y="-62" width="6" height="34" rx="3" fill="#2b3440"/>
      <circle cx="0" cy="-64" r="5" fill="#2b3440"/>
      <rect x="-24" y="-30" width="48" height="58" rx="6" fill="#eef3f7" stroke="#9fb0c0" stroke-width="2"/>
      <rect x="-15" y="-20" width="30" height="16" rx="3" fill="#1d2a36"/>
      <rect x="-11" y="-16" width="14" height="3" rx="1.5" fill="#3ee6c4"/>
      <circle cx="0" cy="12" r="4" fill="#c7d3de"/>
    </g>
    <g id="ondes" fill="none" stroke-width="3" stroke-linecap="round">
      <path d="M-16,-8 a22,22 0 0 1 0,-30" /><path d="M16,-8 a22,22 0 0 0 0,-30" />
      <path d="M-26,-2 a34,34 0 0 1 0,-42" /><path d="M26,-2 a34,34 0 0 0 0,-42" />
    </g>
    <!-- Maison -->
    <g id="maison">
      <rect x="-58" y="-62" width="116" height="62" fill="#f1c27d"/>
      <path d="M-70,-58 L0,-108 L70,-58 Z" fill="#7a4a3a"/>
      <rect x="-40" y="-44" width="22" height="20" fill="#2f4f6f"/><rect x="18" y="-44" width="22" height="20" fill="#2f4f6f"/>
      <rect x="-10" y="-34" width="20" height="34" fill="#5b3a2c"/>
      <rect x="28" y="-104" width="12" height="26" fill="#6a3d30"/>
    </g>
  </defs>

  <rect y="-60" width="1600" height="540" fill="url(#ciel)"/>
  <g fill="#ffffff" opacity=".5"><circle cx="120" cy="40" r="1.6"/><circle cx="420" cy="70" r="1.2"/><circle cx="760" cy="30" r="1.4"/><circle cx="1020" cy="60" r="1.2"/><circle cx="1380" cy="38" r="1.6"/><circle cx="1530" cy="90" r="1.2"/></g>

  <!-- Sol -->
  <rect x="0" y="330" width="1600" height="6" fill="#26323e"/>

  <!-- 1. Client muet : piéton et voiture -->
  <g transform="translate(70,330)">
    <!-- personne avec poste portable -->
    <circle cx="0" cy="-92" r="12" fill="#e8c5a0"/>
    <path d="M-14,-78 h28 l6,46 h-40 Z" fill="#3b82f6"/>
    <rect x="-12" y="-32" width="9" height="32" fill="#1e293b"/><rect x="3" y="-32" width="9" height="32" fill="#1e293b"/>
    <rect x="14" y="-74" width="12" height="20" rx="2" fill="#eef3f7" stroke="#9fb0c0" stroke-width="1.5"/><rect x="18" y="-88" width="3" height="14" fill="#2b3440"/>
  </g>
  <g transform="translate(200,330)">
    <path d="M-80,-16 v-22 q0,-10 10,-12 l30,-6 l26,-26 q8,-6 18,-6 h48 q12,0 18,8 l20,26 q22,4 22,18 v20 Z" fill="#e5edf3"/>
    <path d="M-34,-56 l22,-24 h34 v24 Z M30,-80 h12 q8,0 12,6 l14,18 h-38 Z" fill="#3a5068"/>
    <circle cx="-46" cy="-14" r="15" fill="#1e293b"/><circle cx="-46" cy="-14" r="6" fill="#94a3b8"/>
    <circle cx="66" cy="-14" r="15" fill="#1e293b"/><circle cx="66" cy="-14" r="6" fill="#94a3b8"/>
    <g transform="translate(10,-104) scale(.6)"><use href="#noeud"/></g>
  </g>

  <!-- 2. Client de base : maison, nœud sur le toit -->
  <g transform="translate(400,330)"><use href="#maison"/><g transform="translate(-30,-104) scale(.75)"><use href="#noeud"/></g></g>

  <!-- 3. Routeur : sommet dégagé -->
  <path d="M500,330 L640,190 L700,214 L780,96 L860,200 L930,170 L1030,330 Z" fill="url(#roc)"/>
  <path d="M780,96 L748,142 L766,138 L780,158 L796,136 L812,140 Z" fill="#f3f6f9"/>
  <path d="M640,190 L624,208 L646,206 L656,198 Z" fill="#f3f6f9" opacity=".8"/>
  <g transform="translate(780,92)"><use href="#noeud"/><g transform="translate(0,-60)" stroke="#4ade80"><use href="#ondes"/></g></g>

  <!-- 4. Client : maison -->
  <g transform="translate(1050,330) scale(.9)"><use href="#maison"/><g transform="translate(-30,-104) scale(.75)"><use href="#noeud"/></g></g>

  <!-- 5. Routeur tardif : colline -->
  <path d="M1120,330 L1210,250 L1250,262 L1300,214 L1360,268 L1420,330 Z" fill="url(#roc2)"/>
  <g transform="translate(1300,210) scale(.85)"><use href="#noeud"/><g transform="translate(0,-60)" stroke="#a78bfa"><use href="#ondes"/></g></g>

  <!-- 6. Client : maison -->
  <g transform="translate(1500,330) scale(.9)"><use href="#maison"/><g transform="translate(-30,-104) scale(.75)"><use href="#noeud"/></g></g>

  <!-- Bandes de couleur et légendes -->
  <g font-weight="800" font-size="25">
    <rect x="20" y="352" width="272" height="6" rx="3" fill="#38bdf8"/>
    <text x="20" y="392" fill="#38bdf8">Client muet</text>
    <rect x="300" y="352" width="190" height="6" rx="3" fill="#f472b6"/>
    <text x="300" y="392" fill="#f472b6">Client de base</text>
    <rect x="500" y="352" width="490" height="6" rx="3" fill="#4ade80"/>
    <text x="700" y="392" fill="#4ade80" text-anchor="middle">Routeur</text>
    <rect x="998" y="352" width="120" height="6" rx="3" fill="#fb923c"/>
    <text x="1000" y="392" fill="#fb923c">Client</text>
    <rect x="1126" y="352" width="290" height="6" rx="3" fill="#a78bfa"/>
    <text x="1270" y="392" fill="#a78bfa" text-anchor="middle">Routeur tardif</text>
    <rect x="1424" y="352" width="156" height="6" rx="3" fill="#facc15"/>
    <text x="1430" y="392" fill="#facc15">Client</text>
  </g>
  <g font-size="16" fill="#c3d0dc">
    <text x="20" y="420">Mobile, portable, voiture :</text><text x="20" y="441">ne relaie jamais</text>
    <text x="300" y="420">Sur un toit : relaie</text><text x="300" y="441">en priorité ses favoris</text>
    <text x="700" y="420" text-anchor="middle">Point haut et dégagé : relaie tout, en premier.</text><text x="700" y="441" text-anchor="middle">Un seul par zone, sinon il encombre le canal</text>
    <text x="1000" y="420">Relaie si</text><text x="1000" y="441">besoin</text>
    <text x="1270" y="420" text-anchor="middle">Bouche un trou de couverture :</text><text x="1270" y="441" text-anchor="middle">relaie tout, après les autres</text>
    <text x="1430" y="420">Rôle par</text><text x="1430" y="441">défaut</text>
  </g>
  <g font-size="13.5" fill="#7f93a6" font-family="ui-monospace, Menlo, Consolas, monospace" letter-spacing=".5">
    <text x="20" y="466">CLIENT_MUTE</text><text x="300" y="466">CLIENT_BASE</text><text x="700" y="466" text-anchor="middle">ROUTER</text>
    <text x="1000" y="466">CLIENT</text><text x="1270" y="466" text-anchor="middle">ROUTER_LATE</text><text x="1430" y="466">CLIENT</text>
  </g>
</svg>
