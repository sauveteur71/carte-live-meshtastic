server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  location / { try_files $uri $uri/ /index.html; }
  location ~* \.(?:js|css|png|svg|ico|woff2?|ttf|json|wasm)$ { expires 7d; add_header Cache-Control "public"; try_files $uri =404; }
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
