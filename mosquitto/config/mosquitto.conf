# ============================================================
#  Mosquitto — exemple de broker pour la carte live Meshtastic
#  (comptes dans passwd, droits dans acl : voir acl.exemple)
# ============================================================

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
connection_messages true

# Réglages communs à tous les ports
per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Un paquet Meshtastic fait moins de 512 octets : on refuse les messages anormaux
max_packet_size 16384
# Pas de messages en attente pour les clients déconnectés (passerelles radio)
max_queued_messages 200

# ---- Réseau local uniquement (NE PAS rediriger ce port sur la box) ----
listener 1883
protocol mqtt

# ---- Internet : MQTT chiffré pour les passerelles distantes ----
# Port à rediriger sur la box vers le serveur. Certificat Let's Encrypt de votre domaine
# (ex. mqtt.mondomaine.fr), copié par copier-certificat.sh sur un NAS Synology.
listener 8883
protocol mqtt
certfile /mosquitto/certs/cert.pem
cafile /mosquitto/certs/chain.pem
keyfile /mosquitto/certs/privkey.pem
tls_version tlsv1.2
