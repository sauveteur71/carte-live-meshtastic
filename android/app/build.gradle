// Application Android de la carte live : une fenêtre sur la carte de votre serveur (adresse choisie au premier lancement)
plugins { id 'com.android.application' }

def versionCarte = new groovy.json.JsonSlurper().parse(file('../../carte-live/package.json')).version
def parts = versionCarte.tokenize('.').collect { it as int }

android {
    namespace 'fr.carte.live'
    compileSdk 35
    defaultConfig {
        applicationId 'fr.carte.live'
        minSdk 24
        targetSdk 35
        versionName versionCarte
        versionCode parts[0] * 10000 + parts[1] * 100 + parts[2]
    }
    signingConfigs {
        // Clé de signature fixe, pour que chaque nouvelle version s'installe par-dessus l'ancienne.
        // Par défaut : cle-publique.jks du dépôt (mot de passe « android », comme une clé de test Android : elle ne
        // protège pas contre une APK modifiée par un tiers ; téléchargez l'APK seulement depuis les versions GitHub).
        // Avec les secrets ANDROID_CLE / ANDROID_CLE_MOT_DE_PASSE, une clé privée la remplace.
        publication {
            def privee = System.getenv('ANDROID_CLE_FICHIER')
            storeFile file(privee ?: 'cle-publique.jks')
            storePassword privee ? System.getenv('ANDROID_CLE_MOT_DE_PASSE') : 'android'
            keyAlias 'carte-live'
            keyPassword privee ? System.getenv('ANDROID_CLE_MOT_DE_PASSE') : 'android'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.publication
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
