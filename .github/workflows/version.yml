# À chaque version vX.Y.Z : compile l'agent (Windows, Linux, Raspberry Pi) et l'attache à la page de la version.
name: Version

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Compilation de l'agent
        working-directory: agent
        run: |
          mkdir -p ../dist
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../dist/agent-gaulix-windows.exe .
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../dist/agent-gaulix-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ../dist/agent-gaulix-raspberrypi-arm64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags="-s -w" -o ../dist/agent-gaulix-raspberrypi-armv7 .
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ../dist/agent-gaulix-macos-arm64 .
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
