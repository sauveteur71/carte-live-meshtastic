# Application Android (APK) : une fenêtre sur la carte de votre serveur (adresse choisie au premier lancement).
# - À chaque envoi qui touche android/ : construite et vérifiée (fichier téléchargeable dans l'onglet Actions).
# - À chaque version publiée (workflow « Image Docker » avec « publier ») : l'APK est jointe à la version GitHub.
# Signature : clé fixe (android/app/cle-publique.jks, ou une clé privée dans les secrets ANDROID_CLE et
# ANDROID_CLE_MOT_DE_PASSE), pour que chaque nouvelle version s’installe par-dessus l’ancienne.
name: Android

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_run:
    workflows: ['Image Docker']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    # Après « Image Docker » : seulement quand une version vient d'être publiée (lancement manuel réussi)
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Clé de signature
        env:
          ANDROID_CLE: ${{ secrets.ANDROID_CLE }}
        # La clé privée n'est utilisée qu'à partir du moment où le fichier android/cle-privee existe : la version
        # d'avant (signée avec la clé publique) sait déjà expliquer aux téléphones la réinstallation à faire une fois
        run: |
          if [ -n "$ANDROID_CLE" ] && [ -f android/cle-privee ]; then echo "$ANDROID_CLE" | base64 -d > "$RUNNER_TEMP/carte-live.jks"; echo "ANDROID_CLE_FICHIER=$RUNNER_TEMP/carte-live.jks" >> "$GITHUB_ENV"; echo "Signature : clé privée";
          else echo "Signature : clé publique (android/app/cle-publique.jks)"; fi
      - name: Construction
        working-directory: android
        env:
          ANDROID_CLE_MOT_DE_PASSE: ${{ secrets.ANDROID_CLE_MOT_DE_PASSE }}
        run: |
          gradle --no-daemon assembleRelease
          v=$(node -p "require('../carte-live/package.json').version")
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/carte-live-$v.apk"
          # Paquet AAB pour Google Play (sans recherche de mise à jour GitHub), à déposer dans la Play Console
          gradle --no-daemon -Pplay bundleRelease
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/carte-live-$v-google-play.aab"
          echo "AAB=$RUNNER_TEMP/carte-live-$v-google-play.aab" >> "$GITHUB_ENV"
          echo "APK=$RUNNER_TEMP/carte-live-$v.apk" >> "$GITHUB_ENV"
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: carte-live-android
          path: |
            ${{ env.APK }}
            ${{ env.AAB }}
      - name: Jointe à la version
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v$VERSION" "$APK" --clobber -R "$GITHUB_REPOSITORY"
