# Vérifications rapides à chaque proposition de modification
name: Vérifications

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntaxe JavaScript
        run: for f in carte-live/src/*.js carte-live/src/meshcore/*.js carte-live/public/*.js carte-live/outils/*.js; do node --check "$f"; done
      - name: Version du README à jour
        run: |
          v=$(node -p "require('./carte-live/package.json').version")
          grep -q "Version actuelle : $v" README.md || { echo "README.md : indiquer « Version actuelle : $v »"; exit 1; }
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Agent
        working-directory: agent
        run: go vet ./... && go build ./...

  interface:
    # Tests de l'interface dans un vrai navigateur : carte, rubriques, aide, recherche, DFCI, anglais, pages publiques
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: carte-live/package-lock.json
      - name: Dépendances
        working-directory: carte-live
        run: npm ci --omit=dev && npm i --no-save playwright acorn@8.14.0 acorn-walk@8.3.4 && npx playwright install --with-deps chromium
      - name: Tests du décodage radio (Meshtastic, MeshCore, DFCI, passerelle)
        working-directory: carte-live
        run: node --test tests/radio.js
      - name: Textes du serveur traduits en anglais (journal, erreurs, diagnostic, alertes)
        working-directory: carte-live
        run: node outils/textes-serveur.js
      - name: Tests de l'interface
        working-directory: carte-live
        run: node tests/interface.js
      - name: Captures et journal en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-interface
          path: carte-live/tests/resultats/
