# Vérifications rapides à chaque proposition de modification
name: Vérifications

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntaxe JavaScript
        run: for f in carte-live/src/*.js carte-live/src/meshcore/*.js carte-live/public/*.js carte-live/outils/*.js; do node --check "$f"; done
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Agent
        working-directory: agent
        run: go vet ./... && go build ./...
