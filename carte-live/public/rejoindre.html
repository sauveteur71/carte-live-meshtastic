<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rejoindre le réseau</title>
  <meta name="description" content="Rejoindre le réseau maillé LoRa : canal, réglages conseillés, règles et relais">
  <style>
    :root { --fond: #070b10; --surface: #0f1922; --bord: #2b3a47; --texte: #f2f6f8; --doux: #b9c6d1; --accent: #2ee6c0; --live: #ff8a1f; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--fond); color: var(--texte); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
    a { color: var(--accent); } a:hover, a:focus-visible { color: #8af5df; }
    a:focus-visible, button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    main { max-width: 920px; margin: 0 auto; padding: 24px 16px 48px; }
    header.tete { display: flex; align-items: center; gap: 18px; margin: 8px 0 24px; }
    header.tete img { width: 64px; height: 71px; flex: none; }
    h1 { font-size: clamp(26px, 5vw, 38px); line-height: 1.1; margin: 0; letter-spacing: -.5px; }
    .sous { color: var(--doux); margin: 4px 0 0; }
    h2 { font-size: 21px; margin: 0 0 12px; display: flex; align-items: center; gap: 10px; }
    h2 .n { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: #06120f; font-size: 16px; flex: none; }
    section { background: var(--surface); border: 1px solid var(--bord); border-radius: 14px; padding: 20px; margin: 0 0 16px; }
    .presentation { font-size: 17px; white-space: pre-line; }
    .canal { display: grid; grid-template-columns: minmax(0, 240px) 1fr; gap: 20px; align-items: start; }
    .qr { background: #fff; border-radius: 10px; padding: 6px; }
    .qr svg { display: block; width: 100%; height: auto; }
    .boutons { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
    details.commandes { margin-top: 12px; } details.commandes summary { cursor: pointer; font-weight: 600; }
    details.commandes pre { background: #0b1d26; color: #d6f5ec; border-radius: 8px; padding: 10px 12px; overflow-x: auto; font-size: 13px; line-height: 1.45; }
    .bouton { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 18px; border-radius: 10px; border: 1px solid var(--bord); background: #16232f; color: var(--texte); font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; }
    .bouton.principal { background: var(--accent); color: #06120f; border-color: var(--accent); }
    .bouton.don { background: var(--live); color: #1a0d00; border-color: var(--live); }
    dl.reglages { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 0; }
    dl.reglages dt { color: var(--doux); }
    dl.reglages dd { margin: 0; font-weight: 700; font-family: ui-monospace, "SF Mono", Consolas, monospace; }
    ul.liste { margin: 0; padding-left: 22px; } ul.liste li { margin: 4px 0; }
    .note { color: var(--doux); font-size: 14px; }
    .relais { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; padding: 0; margin: 0; }
    .relais li { padding: 4px 10px; border: 1px solid var(--bord); border-radius: 99px; font-size: 14px; }
    .relais li small { color: var(--doux); }
    .partage { display: grid; grid-template-columns: 140px 1fr; gap: 16px; align-items: center; }
    .erreur { padding: 40px 20px; text-align: center; color: var(--doux); }
    footer { color: var(--doux); font-size: 13px; text-align: center; margin-top: 24px; }
    @media (max-width: 620px) { .canal, .partage { grid-template-columns: 1fr; } .qr { max-width: 260px; } .partage .qr { max-width: 160px; } }
    @media print {
      :root { --fond: #fff; --surface: #fff; --bord: #999; --texte: #000; --doux: #333; --accent: #0a6f5c; }
      .boutons, footer .imprimer { display: none; } section { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <main id="page" aria-live="polite">
    <p class="erreur">Chargement…</p>
  </main>
  <script src="/langue.js"></script>
  <script src="/rejoindre.js"></script>
</body>
</html>
