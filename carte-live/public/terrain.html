<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Recherche de balise</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <style>
    :root { --fond: #0b1117; --surface: #111a23; --bord: rgba(120, 160, 190, 0.3); --texte: #f1f5f9; --doux: #c3d0dc; --accent: #3ee6c4; --critique: #ff5c6c; --police: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--fond); color: var(--texte); font: 15px/1.4 var(--police); }
    body { display: flex; flex-direction: column; overflow: hidden; }
    header { padding: 8px 12px; padding-top: max(8px, env(safe-area-inset-top)); background: var(--surface); border-bottom: 1px solid var(--bord); }
    header h1 { font-size: 16px; margin: 0; }
    header small { color: var(--doux); }
    #carte { flex: 1; min-height: 0; }
    #fiche { background: var(--surface); border-top: 1px solid var(--bord); padding: 10px 12px; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
    .grand { font: 700 18px ui-monospace, Menlo, Consolas, monospace; }
    .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
    .note { color: var(--doux); font-size: 13px; }
    .boutons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    button, a.bouton { font: inherit; font-weight: 650; color: var(--texte); background: #1b2733; border: 1px solid var(--bord); border-radius: 10px; padding: 10px 14px; min-height: 46px; text-decoration: none; display: inline-flex; align-items: center; }
    button.principal { background: var(--accent); color: #062019; border-color: var(--accent); }
    .cap { font-size: 20px; font-weight: 800; color: var(--accent); }
    .erreur { color: var(--critique); font-weight: 650; }
    .etq-releve { background: rgba(11, 17, 23, .9); color: #fff; border: 1px solid rgba(255,255,255,.35); border-radius: 6px; padding: 2px 7px; font-size: 12.5px; white-space: nowrap; }
    .leaflet-tooltip-left.etq-releve::before { border-left-color: rgba(11, 17, 23, .9); }
  </style>
</head>
<body>
  <header><h1 id="titre">Recherche de balise</h1><small id="sous-titre">Chargement…</small></header>
  <div id="carte"></div>
  <div id="fiche"><div class="note">Chargement…</div></div>
  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="/dfci.js"></script>
  <script src="/gonio.js"></script>
  <script src="/terrain.js"></script>
</body>
</html>
