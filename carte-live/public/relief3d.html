<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vue 3D du réseau</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/vendor/maplibre/maplibre-gl.css">
  <style>
    :root {
      --fond: #0b1117; --surface: #111a23; --surface-2: #151f29; --bord: rgba(120, 160, 190, 0.28);
      --texte: #f1f5f9; --doux: #c3d0dc; --accent: #3ee6c4; --live: #ff8a1f;
      --infra: #b48cff; --passerelle: #4cc9f0; --client: #80ed99; --mc: #ffb547; --eteint: #7d8a96;
      --police: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--fond); color: var(--texte); font: 14px/1.45 var(--police); }
    body { display: flex; flex-direction: column; overflow: hidden; }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 8px 14px; background: var(--surface); border-bottom: 1px solid var(--bord); }
    header h1 { font-size: 16px; margin: 0 6px 0 0; font-weight: 700; }
    header a.retour { color: var(--accent); text-decoration: none; font-weight: 650; }
    header label { display: inline-flex; align-items: center; gap: 6px; color: var(--doux); min-height: 32px; }
    select, button { font: inherit; color: var(--texte); background: var(--surface-2); border: 1px solid var(--bord); border-radius: 8px; padding: 5px 10px; min-height: 32px; }
    button { cursor: pointer; }
    button[aria-pressed="true"] { background: var(--accent); color: #062019; border-color: var(--accent); font-weight: 650; }
    input[type=checkbox], input[type=range] { accent-color: var(--accent); }
    #carte3d { flex: 1; position: relative; min-height: 0; }
    #avis { position: absolute; z-index: 3; left: 50%; top: 18px; transform: translateX(-50%); max-width: min(560px, calc(100% - 32px)); background: var(--surface); border: 1px solid var(--attention, #ffb547); border-radius: 10px; padding: 12px 16px; }
    #legende { position: absolute; z-index: 2; left: 12px; bottom: 28px; background: rgba(11, 17, 23, .88); border: 1px solid var(--bord); border-radius: 10px; padding: 8px 12px; font-size: 13px; }
    #legende div { display: flex; align-items: center; gap: 8px; margin: 2px 0; }
    #legende i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #0b1117; display: inline-block; }
    #legende i.carre { border-radius: 2px; }
    #legende b.ligne { width: 22px; height: 4px; border-radius: 2px; display: inline-block; }
    .pt3d { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
    .pt3d .rond { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #0b1117; box-shadow: 0 0 0 2px rgba(255,255,255,.35); }
    .pt3d.infra .rond { width: 18px; height: 18px; }
    .pt3d.mc .rond { border-radius: 3px; }
    .pt3d .nom { margin-top: 3px; padding: 1px 6px; border-radius: 6px; background: rgba(11, 17, 23, .85); color: var(--texte); font-size: 12px; font-weight: 600; white-space: nowrap; }
    body.sans-noms .pt3d .nom { display: none; }
    .maplibregl-popup-content { background: var(--surface); color: var(--texte); border: 1px solid var(--bord); border-radius: 10px; font: 13px/1.45 var(--police); padding: 10px 14px; }
    .maplibregl-popup-tip { border-top-color: var(--surface) !important; border-bottom-color: var(--surface) !important; }
    .maplibregl-popup-close-button { color: var(--texte); font-size: 18px; }
    .maplibregl-ctrl-attrib { background: rgba(11, 17, 23, .8) !important; color: var(--doux); }
    .maplibregl-ctrl-attrib a { color: var(--doux); }
    @media (max-width: 640px) { header { gap: 6px 10px; } #legende { font-size: 12px; bottom: 34px; } }
  </style>
</head>
<body>
  <header>
    <a class="retour" href="./">← Carte</a>
    <h1>Vue 3D du réseau</h1>
    <label>Fond
      <select id="fond">
        <option value="sombre">Sombre</option>
        <option value="photos">Photos aériennes IGN</option>
        <option value="topo">Topographique</option>
      </select>
    </label>
    <label><span>Relief ×</span><span id="val-exa" translate="no">1,5</span> <input type="range" id="exa" min="1" max="4" step="0.5" value="1.5"></label>
    <label><input type="checkbox" id="voir-liens" checked> Liaisons 24 h</label>
    <label><input type="checkbox" id="voir-noms" checked> Noms</label>
    <label><input type="checkbox" id="voir-clients"> Nœuds mobiles</label>
    <button type="button" id="tourner" aria-pressed="false">↻ Tourner</button>
    <button type="button" id="dessus">Vue de dessus</button>
  </header>
  <div id="carte3d">
    <div id="avis" hidden></div>
    <div id="legende">
      <div><i style="background: var(--infra)"></i> Relais (Meshtastic)</div>
      <div><i style="background: var(--passerelle)"></i> Passerelle MQTT</div>
      <div><i style="background: var(--client)"></i> Nœud mobile</div>
      <div><i class="carre" style="background: var(--mc)"></i> Répéteur MeshCore</div>
      <div><i style="background: var(--eteint)"></i> Plus entendu</div>
      <div><b class="ligne" style="background: #3ee68a"></b> <span>Bonne liaison ·</span> <b class="ligne" style="background: #ff5c6c"></b> <span>limite</span></div>
    </div>
  </div>
  <script src="/langue.js"></script>
  <script src="/vendor/maplibre/maplibre-gl.js"></script>
  <script src="relief3d.js"></script>
</body>
</html>
